[project]
name = "graphmark"
version = "0.9.1"
description = "Deterministic knowledge-graph analysis for markdown / [[wikilink]] vaults."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Charles Coonce", email = "charlescoonce@gmail.com" }]
keywords = ["knowledge-graph", "markdown", "wikilink", "obsidian", "graph", "pagerank"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = ["networkx>=3.0"]

[project.urls]
Homepage = "https://github.com/cdcoonce/graphmark"
Repository = "https://github.com/cdcoonce/graphmark"
Issues = "https://github.com/cdcoonce/graphmark/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "hypothesis>=6.100"]
# Installed by semantic_release.build_command, not by developers. The
# python-semantic-release GitHub Action is Docker-based and ships without uv, so the
# release's relock step has to install it itself. Declaring the pin here rather than
# inline keeps it visible to Dependabot.
build = ["uv>=0.7,<1.0"]

[project.scripts]
graphmark = "graphmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphmark"]

[tool.hatch.build.targets.sdist]
include = [
    "src/graphmark",
    "tests",
    "docs/ROADMAP.md",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
# Deployment is driven by conventional-commit history: when dev is promoted to main, the
# release workflow (.github/workflows/release.yml) runs python-semantic-release, which reads the
# commits since the last tag, decides the bump, updates the version below, writes CHANGELOG.md,
# commits, tags v<version>, and cuts a GitHub release. The same workflow then publishes to PyPI.
version_toml = ["pyproject.toml:project.version"]
# Runs after the version is stamped into pyproject.toml but before the bump is committed and
# tagged, so `git add uv.lock` lands the relocked file in the release commit itself. Without
# this the lockfile keeps the previous version, and the next local `uv` run dirties the tree —
# which aborts the nightly cycle's clean-tree preflight (#166).
#
# The action is Docker-based and ships without uv, so the step installs it first (see the
# `build` extra). `--upgrade-package graphmark` restricts the relock to this project's own
# version entry: a bare `uv lock` could also bump transitive dependencies at release time,
# turning a version bump into an unreviewed dependency change. The package name is written out
# rather than read from an env var so the command does not depend on an undocumented one —
# and note uv does NOT error on an unknown name, so a rename would silently disable this;
# tests/test_lockfile_version.py pins the literal to project.name for exactly that reason.
#
# Building/publishing stays in the workflow's own uv-based step (release.yml).
build_command = """
    python -m pip install -e '.[build]'
    uv lock --upgrade-package graphmark
    git add uv.lock
"""
tag_format = "v{version}"
commit_message = "chore(release): {version} [skip ci]"
# Pre-1.0: a breaking change bumps the minor, not the major, until the API is declared stable.
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
# feat -> minor, fix/perf -> patch; these types appear in the changelog.
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
