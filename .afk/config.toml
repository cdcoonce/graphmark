# AFK config — graphmark. Executor enabled for Track-A work.
#
# Why almost everything here is Track-A (autonomous-safe): correctness is pinned by a
# FROZEN DIFFERENTIAL ORACLE. Structural outputs are the verbatim results of the reference
# engine (brain_map.py), and PageRank is checked against networkx — both independent of
# anything the executor writes. A green gate therefore proves correctness, not just "doesn't
# crash". The executor cannot regenerate the oracle, so it cannot game it.
#
# THE GATE MIRRORS CI (ruff + pytest). ruff/pytest are dev optional-deps, so the gate uses
# `--extra dev` — a bare `uv run ruff` would not find them.
test_command = "uv run --extra dev ruff check . && uv run --extra dev ruff format --check . && uv run --extra dev pytest -q"
permission_mode = "acceptEdits"

# This repo's promotion policy is branch → PR into `dev` → promote `dev` → `main`; a feature
# branch never lands on `main` directly. afk defaults `trunk_branch` to `main`, which made the
# executor the one actor exempt from that policy: PR #181 was opened against `main` while every
# human PR took two hops. afk#998 made it configurable, and this is the line that opts in — it
# governs BOTH the branch a slice forks from and the branch its PR targets.
#
# TWO CONSEQUENCES, both load-bearing:
#
# 1. The `--cycle` preflight refuses to run unless local HEAD *is* trunk_branch
#    (cycle.py:311). This working copy must therefore sit on `dev`, not `main`. Leaving it on
#    `main` wedges every nightly with "HEAD is 'main', not 'dev' — refusing to reset", which is
#    exactly how the-workshop lost five consecutive runs.
# 2. GitHub auto-closes a linked issue when its PR merges into the repo's DEFAULT branch. The
#    predicate is the DEFAULT branch, not `trunk_branch` — and in THIS repo they are the same
#    branch: `gh api repos/cdcoonce/graphmark --jq .default_branch` returns `dev`. So a slice
#    PR merged into `dev` DOES close its issue, at slice-merge time, and `Depends on #N` gating
#    unblocks there rather than at promote time. Verified 2026-08-01: #181 merged into `dev`
#    and #173 closed COMPLETED in the same action, with no `main` promote in between.
#    Do NOT generalize the-workshop's behavior onto this repo. It carries the same
#    `trunk_branch = "dev"` but its default branch is `main`, so its dev-merges left five
#    shipped issues (#446, #455, #457, #458, #459) sitting `afk:promoted` until a human closed
#    them. The default-branch setting is what differs, not the trunk_branch posture.
#    THE INVERSION TO WATCH: if graphmark's default branch is ever moved to `main`, this repo
#    silently acquires that behavior — slices land, issues stay open, and a phantom-promoted
#    backlog reads exactly like a blocked one. The tempting response is then the wrong one:
#    check each shipped issue's real state and close by hand; do not re-run the drain.
#    The local clone can lie about this. `refs/remotes/origin/HEAD` is written once at clone
#    time and never refreshed, so `git branch -a` here may still print `origin/HEAD ->
#    origin/main`. Ask the API, not the checkout.
trunk_branch = "dev"

# #1048: forwarded to the headless agent as `--allowedTools`. Load-bearing, not decoration.
# A slice runs in a fresh worktree, and Claude Code DISCARDS every `permissions.allow` entry
# in a workspace it has not trusted — argv is the only grant channel that survives. Without
# these, every Bash call parks on an approval prompt no one is present to answer, and the run
# reports a blocked slice rather than a failing one. Measured here 2026-08-01: issue #173
# parked after 2 attempts having been unable to run even `uv --version`, so the gate never
# executed at all.
#
# Deliberately absent: anything that reaches the network (`git ls-remote`, `curl`, `gh`).
# Egress is a security surface, and no slice in this repo needs it — work that requires a
# remote gets its data transcribed into the issue body by a human instead.
allowed_tools = [
  "Bash(uv run --extra dev ruff:*)",
  "Bash(uv run --extra dev pytest:*)",
  "Bash(uv run --extra dev python:*)",
  "Bash(uv run python:*)",
  "Bash(uv --version:*)",
  "Bash(uv pip list:*)",
  "Bash(python3:*)",
  "Bash(python:*)",
]
agent_prompt = """Implement the linked GitHub issue using test-driven development \
(red-green-refactor). Assert behavior against the FROZEN fixtures in tests/fixtures/*/expected.json — \
NEVER edit an expected.json to make a test pass; the oracle is the specification, and if you believe \
a value is wrong, stop and flag it. Implement WITHIN the seeded interfaces in model.py / interfaces.py \
/ config.py; do not redesign module boundaries or rename their types. Keep changes minimal and scoped \
to the issue's acceptance criteria. See CLAUDE.md for the full reference-parity contract. If the issue body explicitly \
directs a change to the seeded surface (a human-triaged decision recorded in the issue), the issue \
wins over the do-not-redesign default."""

[caps]
max_retries = 2
timeout_seconds = 1800

# Tier map. default_tier defaults to 'cheap', which the driver requires model.cheap to
# resolve — without this section every cycle aborts at config load. The promoted backlog
# is all afk:cheap, so cheap is the working tier; frontier is available for escalation.
[model]
cheap = "sonnet"
frontier = "opus"
default_tier = "cheap"

# Scheduled --cycle: read-only producers (scout files proposals from docs/ROADMAP.md;
# harvest mines merged-PR review comments for prompt-rules). Executor runs on promoted issues.
[cycle]
producers = ["scout", "harvest"]
